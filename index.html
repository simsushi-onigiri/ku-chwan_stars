<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For The Only Headache I Never Want to Lose - Ku-chwan The Dearest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0f2c;
    --bg-mid:#131c46;
    --star-glow:#ffe9a8;
    --star-core:#fffaf0;
    --accent-violet:#93a6ff;
    --text-primary:#f4f1ff;
    --text-soft:#b9c2e8;
    --unopened:#54608f;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:radial-gradient(ellipse at 50% 0%, var(--bg-mid) 0%, var(--bg-deep) 65%);
    overflow-x:hidden;
    font-family:'Quicksand', sans-serif;
    color:var(--text-primary);
  }

  .sky{
    position:relative;
    width:100%;
    height:100vh;
    min-height:600px;
    overflow:hidden;
  }

  /* small ambient stars */
  .dot{
    position:absolute;
    width:2px;
    height:2px;
    background:var(--text-primary);
    border-radius:50%;
    opacity:0.6;
    animation:twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.15;}
    50%{opacity:0.9;}
  }

  header{
    position:relative;
    z-index:2;
    text-align:center;
    padding:6vh 1.5rem 1rem;
  }
  header .eyebrow{
    font-size:0.75rem;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--accent-violet);
    margin:0 0 0.6rem;
  }
  header h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:clamp(2.4rem, 6vw, 4rem);
    margin:0 0 0.6rem;
    letter-spacing:0.02em;
  }
  header p{
    font-size:0.95rem;
    color:var(--text-soft);
    max-width:32rem;
    margin:0 auto;
    line-height:1.6;
  }

  svg.lines{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
    pointer-events:none;
  }
  svg.lines line{
    stroke:var(--accent-violet);
    stroke-width:1;
    opacity:0;
    transition:opacity 1.2s ease;
  }
  svg.lines line.drawn{
    opacity:0.45;
  }

  .star-btn{
    position:absolute;
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
    z-index:2;
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 0 6px rgba(84,96,143,0.5));
    transition:filter 0.6s ease, transform 0.3s ease;
  }
  .star-btn:hover{
    transform:translate(-50%,-50%) scale(1.08);
  }
  .star-btn svg{
    width:38px;
    height:38px;
    display:block;
  }
  .star-btn polygon{
    fill:var(--unopened);
    transition:fill 0.8s ease;
  }
  .star-btn.opened{
    filter:drop-shadow(0 0 14px var(--star-glow)) drop-shadow(0 0 26px rgba(255,233,168,0.5));
    animation:pulse 3s ease-in-out infinite;
  }
  .star-btn.opened polygon{
    fill:var(--star-core);
  }
  @keyframes pulse{
    0%,100%{filter:drop-shadow(0 0 14px var(--star-glow)) drop-shadow(0 0 26px rgba(255,233,168,0.5));}
    50%{filter:drop-shadow(0 0 20px var(--star-glow)) drop-shadow(0 0 34px rgba(255,233,168,0.7));}
  }

  footer.note{
    position:relative;
    z-index:2;
    text-align:center;
    padding:0 1.5rem 5vh;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.15rem;
    color:var(--text-soft);
    opacity:0;
    transform:translateY(10px);
    transition:opacity 1s ease, transform 1s ease;
  }
  footer.note.show{
    opacity:1;
    transform:translateY(0);
  }

  /* card overlay */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(6,9,26,0.72);
    backdrop-filter:blur(3px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:10;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.4s ease;
  }
  .overlay.active{
    opacity:1;
    pointer-events:auto;
  }

  .card-scene{
    perspective:1400px;
    width:min(90vw, 420px);
  }
  .card{
    position:relative;
    width:100%;
    min-height:260px;
    transform-style:preserve-3d;
    transition:transform 0.9s cubic-bezier(.4,.2,.2,1);
  }
  .overlay.active .card{
    transform:rotateY(180deg);
  }
  .card-face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem;
    text-align:center;
  }
  .card-front{
    background:linear-gradient(160deg, var(--bg-mid), var(--bg-deep));
    border:1px solid rgba(255,233,168,0.25);
  }
  .card-front svg{
    width:54px;
    height:54px;
    filter:drop-shadow(0 0 12px var(--star-glow));
  }
  .card-back{
    background:linear-gradient(160deg, #1a2456, var(--bg-deep));
    border:1px solid rgba(147,166,255,0.35);
    transform:rotateY(180deg);
    flex-direction:column;
    gap:0.9rem;
  }
  .card-back .label{
    font-size:0.7rem;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--accent-violet);
  }
  .card-back p{
    font-family:'Cormorant Garamond', serif;
    font-size:1.35rem;
    line-height:1.5;
    margin:0;
    color:var(--text-primary);
  }
  .close-btn{
    position:absolute;
    top:-2.6rem;
    right:0;
    background:none;
    border:none;
    color:var(--text-soft);
    font-size:0.85rem;
    letter-spacing:0.15em;
    cursor:pointer;
    font-family:'Quicksand', sans-serif;
  }
  .close-btn:hover{
    color:var(--text-primary);
  }

  @media (max-width:600px){
    .star-btn svg{ width:30px; height:30px; }
    header{ padding-top:8vh; }
  }
</style>
</head>
<body>

<div class="sky" id="sky">
  <svg class="lines" id="lines"></svg>
  <header>
    <p class="eyebrow">for ku</p>
    <h1>five things, written in the sky</h1>
    <p>a small constellation of everything I've noticed. tap a star to open it.</p>
  </header>
  <!-- big stars injected by JS -->
  <footer class="note" id="finalNote">and this is only the sky's version of the list — the real one keeps going.</footer>
</div>

<div class="overlay" id="overlay">
  <div class="card-scene">
    <button class="close-btn" id="closeBtn">close ✕</button>
    <div class="card" id="card">
      <div class="card-face card-front">
        <svg viewBox="0 0 51 48"><polygon points="25.5,1 31.6,18.5 50,18.9 35.3,29.9 40.7,47.5 25.5,36.9 10.3,47.5 15.7,29.9 1,18.9 19.4,18.5" fill="#ffe9a8"/></svg>
      </div>
      <div class="card-face card-back">
        <span class="label" id="cardLabel"></span>
        <p id="cardText"></p>
      </div>
    </div>
  </div>
</div>

<script>
  // positions approximate the real Leo constellation:
  // Adhafera (mane) -> Algieba (sickle curve) -> Regulus (heart) form the head,
  // Zosma -> Denebola trace the back and tail.
  const stars = [
    { x: 16, y: 28, text: "The crime of working hard with no one there to witness it." },
    { x: 40, y: 16, text: "An actual quick learner — not just a line on a resume." },
    { x: 64, y: 26, text: "A couch potato, sure. But never just a potato." },
    { x: 82, y: 46, text: "Doing the most — on the clock, and off it." },
    { x: 30, y: 58, text: "A true butterfly — always fluttering to the next flower, never without leaving an impression." }
  ];

  const sky = document.getElementById('sky');
  const linesSvg = document.getElementById('lines');
  const overlay = document.getElementById('overlay');
  const cardText = document.getElementById('cardText');
  const cardLabel = document.getElementById('cardLabel');
  const closeBtn = document.getElementById('closeBtn');
  const finalNote = document.getElementById('finalNote');

  const openedOrder = [];
  let activeIndex = null;

  // small ambient stars
  for(let i=0;i<140;i++){
    const d = document.createElement('div');
    d.className = 'dot';
    d.style.left = Math.random()*100 + '%';
    d.style.top = Math.random()*100 + '%';
    d.style.animationDelay = (Math.random()*4) + 's';
    sky.appendChild(d);
  }

  const starPoints = "25.5,1 31.6,18.5 50,18.9 35.3,29.9 40.7,47.5 25.5,36.9 10.3,47.5 15.7,29.9 1,18.9 19.4,18.5";

  stars.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'star-btn';
    btn.style.left = s.x + '%';
    btn.style.top = s.y + '%';
    btn.setAttribute('aria-label', 'reveal star ' + (i+1));
    btn.innerHTML = `<svg viewBox="0 0 51 48"><polygon points="${starPoints}"/></svg>`;
    btn.addEventListener('click', () => openStar(i));
    sky.appendChild(btn);
    s.el = btn;
  });

  function openStar(i){
    activeIndex = i;
    cardText.textContent = stars[i].text;
    cardLabel.textContent = 'star ' + (i+1) + ' of 5';
    overlay.classList.add('active');

    if(!stars[i].el.classList.contains('opened')){
      stars[i].el.classList.add('opened');
      if(openedOrder.length > 0){
        drawLine(openedOrder[openedOrder.length-1], i);
      }
      openedOrder.push(i);
      if(openedOrder.length === stars.length){
        setTimeout(()=> finalNote.classList.add('show'), 900);
      }
    }
  }

  function drawLine(fromIdx, toIdx){
    const from = stars[fromIdx];
    const to = stars[toIdx];
    const ns = 'http://www.w3.org/2000/svg';
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', from.x + '%');
    line.setAttribute('y1', from.y + '%');
    line.setAttribute('x2', to.x + '%');
    line.setAttribute('y2', to.y + '%');
    linesSvg.appendChild(line);
    requestAnimationFrame(()=> line.classList.add('drawn'));
  }

  closeBtn.addEventListener('click', () => {
    overlay.classList.remove('active');
  });
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) overlay.classList.remove('active');
  });
</script>

</body>
</html>
